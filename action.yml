name: kustomize-validate
description: >
  Tier-1 validation for kustomize repos: render every kustomization
  (structural YAML — catches malformed resource lists before they halt
  ArgoCD reconciliation), schema-check the rendered objects with
  kubeconform (catches misspelled fields that CRDs with
  x-kubernetes-preserve-unknown-fields silently drop), and check
  homelab's own D-013 coverage rule (Reloader annotation on every
  secret-consuming workload) — homelab#529. VPA coverage (D-012) is a
  planned follow-up, not yet included. No cluster access needed;
  server-side dry-run is deliberately NOT here (it authorizes with write
  verbs — see the README).

inputs:
  paths:
    description: >
      Space-separated kustomization directories to validate. Default
      auto-discovers every directory containing kustomization.yaml.
    default: ""
  kubeconform_flags:
    description: Extra flags for kubeconform (e.g. -skip Something).
    default: ""
  homelab_ref:
    description: >
      Pinned commit SHA of dvystrcil/homelab to fetch the D-013 Reloader
      coverage checker from (homelab#529). Deliberately a fixed SHA, not
      a branch — bump manually when the check's logic changes, so this
      action's behavior never shifts silently underneath a consuming
      repo's PR.
    default: "9d888d980c09bf214b2b5f2ca371074611c0a152"

runs:
  using: composite
  steps:
    - name: Install kubeconform
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v kubeconform >/dev/null; then
          curl -fsSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp kubeconform
          mkdir -p "$HOME/.local/bin" && mv /tmp/kubeconform "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Fetch D-013 Reloader coverage checker (homelab, pinned)
      shell: bash
      run: |
        set -euo pipefail
        REF="${{ inputs.homelab_ref }}"
        curl -fsSL -o /tmp/audit-reloader-coverage.py \
          "https://raw.githubusercontent.com/dvystrcil/homelab/${REF}/bin/audit-reloader-coverage.py"
        curl -fsSL -o /tmp/reloader-exemptions.yaml \
          "https://raw.githubusercontent.com/dvystrcil/homelab/${REF}/policy/reloader-exemptions.yaml" \
          || echo "workloads: []" > /tmp/reloader-exemptions.yaml
        python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

    - name: Render and validate manifests
      shell: bash
      run: |
        set -euo pipefail
        FAILED=0
        # kubeconform's -skip takes ONE comma-separated value, not a
        # repeatable flag — `-skip A -skip B` silently drops A (Go's
        # flag.String keeps only the last occurrence). Adding a new
        # exception means appending to the existing -skip line, never
        # a second -skip line (broke ImageUpdater for ~13 repos when
        # SealedSecret was added as a separate line, 2026-07-24 —
        # caught by a live batch of real PRs turning red).
        #
        # -skip ImageUpdater: the datree catalog's schema for our
        # argocd-image-updater CRD is WRONG (requires spec.namespace which
        # the real CRD doesn't; rejects useAnnotations which it does allow)
        # → false failures on valid CRs. IU CRs have their own structure
        # audit (homelab bin/audit-iu-patterns.py) + the homelab-image-updater
        # skill. Proper fix later: validate against cluster-extracted CRD
        # schemas instead of the third-party catalog.
        #
        # -skip SealedSecret: same class of problem. `kubectl kustomize`
        # always serializes creationTimestamp: null on every embedded
        # ObjectMeta (standard API-machinery behavior, unavoidable) —
        # including spec.template.metadata here — but the datree catalog's
        # bitnami.com/sealedsecret schema doesn't allow it there. False
        # failure on every valid SealedSecret (homelab/homepage#1,
        # 2026-07-23).
        #
        # -skip InfisicalSecret: third occurrence of the same class of
        # problem — datree's secrets.infisical.com/infisicalsecret schema
        # marks resyncInterval as required (it's optional, operator
        # defaults it) and rejects managedSecretReference.template.metadata
        # (a real, commonly-used field — e.g. setting
        # reloader.stakater.com/auto on the generated Secret). False
        # failure on a well-formed CR matching this cluster's own documented
        # InfisicalSecret pattern (dvystrcil/prometheus
        # secrets/alertmanager-discord.yaml, 2026-07-24) — used across
        # nearly every repo in this cluster, so worth fixing here once
        # rather than per-repo.
        CONFORM='kubeconform -strict -summary -ignore-missing-schemas
          -skip ImageUpdater,SealedSecret,InfisicalSecret
          -schema-location default
          -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
          ${{ inputs.kubeconform_flags }}'

        # --- kustomize repos: render each ROOT kustomization, then conform.
        # (bases are reached through their overlays; a base alone can miss
        # patches.) Track their dirs so the raw pass skips them.
        KDIRS=$(find . -name kustomization.yaml -not -path './.git/*' \
                -exec dirname {} \; | sort)
        for dir in ${{ inputs.paths }} $KDIRS; do
          case "$dir" in */base|*/base/*) continue ;; esac
          echo "::group::kustomize build $dir"
          if ! kubectl kustomize "$dir" > /tmp/rendered.yaml; then
            echo "::error::kustomize build failed for $dir"; FAILED=1
            echo "::endgroup::"; continue
          fi
          $CONFORM /tmp/rendered.yaml || { echo "::error::kubeconform $dir"; FAILED=1; }
          # D-013: every workload consuming an InfisicalSecret-managed
          # Secret must carry reloader.stakater.com/auto itself. Checked
          # from THIS repo's own rendered output (homelab#529) — the
          # Deployment and the InfisicalSecret CR managing its Secret are
          # expected to live in the same PR, no live cluster query needed.
          python3 /tmp/audit-reloader-coverage.py \
            --from-manifest /tmp/rendered.yaml \
            --exemptions-file /tmp/reloader-exemptions.yaml --strict \
            || { echo "::error::reloader-coverage $dir"; FAILED=1; }
          echo "::endgroup::"
        done

        # --- raw-manifest / helm-with-raw-dirs repos: conform every yaml
        # that IS a k8s manifest (has a top-level `kind:`) and is NOT part
        # of a kustomization tree. Skips helm values.yaml (no `kind:`).
        # This is what covers non-kustomize repos (obico, immich, …) that
        # the old kustomize-only action passed trivially.
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          skip=0
          for kd in $KDIRS; do case "$f" in "${kd#./}"/*|"$kd"/*) skip=1;; esac; done
          [ "$skip" -eq 1 ] && continue
          grep -qE '^kind:' "$f" || continue
          echo "::group::kubeconform (raw) $f"
          $CONFORM "$f" || { echo "::error::kubeconform $f"; FAILED=1; }
          echo "::endgroup::"
        done < <(find . \( -name '*.yaml' -o -name '*.yml' \) -not -path './.git/*' | sort)

        [ "$FAILED" -eq 0 ] && echo "KUSTOMIZE-VALIDATE-COMPLETE" || exit 1
