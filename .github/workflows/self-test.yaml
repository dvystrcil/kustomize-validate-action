name: Self-test

# This action repo has no CI of its own until now. Covers the D-013
# Reloader coverage step added in homelab#529 AC3 (reloader_coverage_check.py,
# vendored from homelab -- see its own header): runs it against two tiny
# fixture manifests built inline -- one with the gap, one without --
# asserting the exit code each time. Does not exercise kustomize/
# kubeconform (those already have a real-world proof: every consuming
# repo's own PRs), just the new logic this PR adds.

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'reloader_coverage_check.py'
      - 'vpa_coverage_check.py'
      - '.github/workflows/self-test.yaml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  reloader-coverage-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pyyaml
        # venv, not a bare `pip install` -- see the same note in action.yml:
        # a system-Python install is PEP 668 blocked under `act`.
        run: |
          set -euo pipefail
          if python3 -c "import yaml" 2>/dev/null; then
            echo "KV_PYTHON=python3" >> "$GITHUB_ENV"
          else
            python3 -m venv /tmp/self-test-venv
            /tmp/self-test-venv/bin/pip install --quiet pyyaml
            echo "KV_PYTHON=/tmp/self-test-venv/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Fixture — gap present must fail (exit 1)
        run: |
          set -euo pipefail
          cat > /tmp/gap.yaml <<'EOF'
          apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            namespace: fixture-ns
          spec:
            managedSecretReference:
              secretName: app-secrets
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: app
            namespace: fixture-ns
          spec:
            template:
              spec:
                containers:
                  - envFrom:
                      - secretRef:
                          name: app-secrets
          EOF
          echo "workloads: []" > /tmp/no-exemptions.yaml
          if "${KV_PYTHON:-python3}" reloader_coverage_check.py --from-manifest /tmp/gap.yaml \
              --exemptions-file /tmp/no-exemptions.yaml --strict; then
            echo "::error::expected exit 1 (gap present), got 0"; exit 1
          fi
          echo "OK: correctly failed on a real gap"

      - name: Fixture — annotation present must pass (exit 0)
        run: |
          set -euo pipefail
          cat > /tmp/covered.yaml <<'EOF'
          apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            namespace: fixture-ns
          spec:
            managedSecretReference:
              secretName: app-secrets
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: app
            namespace: fixture-ns
            annotations:
              reloader.stakater.com/auto: "true"
          spec:
            template:
              spec:
                containers:
                  - envFrom:
                      - secretRef:
                          name: app-secrets
          EOF
          "${KV_PYTHON:-python3}" reloader_coverage_check.py --from-manifest /tmp/covered.yaml \
            --exemptions-file /tmp/no-exemptions.yaml --strict
          echo "OK: correctly passed with the annotation present"

      - run: echo "SELF-TEST-COMPLETE"

  # The action end to end on this repo, which contains tests/fixtures/
  # chart-repo: a Helm chart whose templates/ must be skipped (Go templates are
  # not YAML until rendered), beside a raw manifest that must still be
  # conformed; and component-repo: a base, a Component that PATCHES it, and an
  # overlay using both. A patching Component cannot be built on its own; it is validated
  # through the overlay. Before the fix, auto-discovery built it standalone and
  # failed (dvystrcil/argocd#46, whose components are the same shape).
  action-with-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./

  # The chart-template skip must not become a blind spot: a templates/ dir
  # with NO Chart.yaml above it is not a chart, so a broken file there must
  # still fail the action.
  templates-without-chart-still-checked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Plant a broken manifest in a templates/ dir that is not a chart
        run: |
          mkdir -p not-a-chart/templates
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ broken }}\n' > not-a-chart/templates/cm.yaml
      - id: action
        uses: ./
        continue-on-error: true
      - name: The action must have failed on it
        run: test "${{ steps.action.outcome }}" = "failure"

  vpa-coverage-unit:
    # D-012 PR-time check (homelab#529 AC2): added/changed workloads need a
    # VPA, untouched and image-only changes are not judged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || { python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet pyyaml && export PATH=/tmp/v/bin:$PATH; }
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee ut.out
          grep -q '^OK$' ut.out
          grep -qE '^Ran [1-9][0-9]* tests' ut.out
