name: Self-test

# This action repo has no CI of its own until now. Covers the D-013
# Reloader coverage step added in homelab#529 AC3 (reloader_coverage_check.py,
# vendored from homelab -- see its own header): runs it against two tiny
# fixture manifests built inline -- one with the gap, one without --
# asserting the exit code each time. Does not exercise kustomize/
# kubeconform (those already have a real-world proof: every consuming
# repo's own PRs), just the new logic this PR adds.

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'reloader_coverage_check.py'
      - 'vpa_coverage_check.py'
      - 'crd_schemas.py'
      - 'schemas/**'
      - '.github/workflows/self-test.yaml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  reloader-coverage-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pyyaml
        # venv, not a bare `pip install` -- see the same note in action.yml:
        # a system-Python install is PEP 668 blocked under `act`.
        run: |
          set -euo pipefail
          if python3 -c "import yaml" 2>/dev/null; then
            echo "KV_PYTHON=python3" >> "$GITHUB_ENV"
          else
            python3 -m venv /tmp/self-test-venv
            /tmp/self-test-venv/bin/pip install --quiet pyyaml
            echo "KV_PYTHON=/tmp/self-test-venv/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Fixture — gap present must fail (exit 1)
        run: |
          set -euo pipefail
          cat > /tmp/gap.yaml <<'EOF'
          apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            namespace: fixture-ns
          spec:
            managedSecretReference:
              secretName: app-secrets
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: app
            namespace: fixture-ns
          spec:
            template:
              spec:
                containers:
                  - envFrom:
                      - secretRef:
                          name: app-secrets
          EOF
          echo "workloads: []" > /tmp/no-exemptions.yaml
          if "${KV_PYTHON:-python3}" reloader_coverage_check.py --from-manifest /tmp/gap.yaml \
              --exemptions-file /tmp/no-exemptions.yaml --strict > /tmp/gap.out; then
            echo "::error::expected exit 1 (gap present), got 0"; exit 1
          fi
          cat /tmp/gap.out
          # The message is the fix instruction bin/ci-autofix.py hands a
          # model (homelab#529 AC5) — it must say WHERE the annotation goes.
          grep -q "own metadata.annotations (not spec.template.metadata)" /tmp/gap.out \
            || { echo "::error::gap message no longer names the annotation's location"; exit 1; }
          echo "OK: correctly failed on a real gap"

      - name: Fixture — annotation present must pass (exit 0)
        run: |
          set -euo pipefail
          cat > /tmp/covered.yaml <<'EOF'
          apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            namespace: fixture-ns
          spec:
            managedSecretReference:
              secretName: app-secrets
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: app
            namespace: fixture-ns
            annotations:
              reloader.stakater.com/auto: "true"
          spec:
            template:
              spec:
                containers:
                  - envFrom:
                      - secretRef:
                          name: app-secrets
          EOF
          "${KV_PYTHON:-python3}" reloader_coverage_check.py --from-manifest /tmp/covered.yaml \
            --exemptions-file /tmp/no-exemptions.yaml --strict
          echo "OK: correctly passed with the annotation present"

      - run: echo "SELF-TEST-COMPLETE"

  # The action end to end on this repo, which contains tests/fixtures/
  # chart-repo: a Helm chart whose templates/ must be skipped (Go templates are
  # not YAML until rendered), beside a raw manifest that must still be
  # conformed; and component-repo: a base, a Component that PATCHES it, and an
  # overlay using both. A patching Component cannot be built on its own; it is validated
  # through the overlay. Before the fix, auto-discovery built it standalone and
  # failed (dvystrcil/argocd#46, whose components are the same shape).
  action-with-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./

  # The chart-template skip must not become a blind spot: a templates/ dir
  # with NO Chart.yaml above it is not a chart, so a broken file there must
  # still fail the action.
  templates-without-chart-still-checked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plant a broken manifest in a templates/ dir that is not a chart
        run: |
          mkdir -p not-a-chart/templates
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ broken }}\n' > not-a-chart/templates/cm.yaml
      - id: action
        uses: ./
        continue-on-error: true
      - name: The action must have failed on it
        run: test "${{ steps.action.outcome }}" = "failure"

  # The raw pass is ONE kubeconform over every file (homelab#1812). A single
  # schema-invalid manifest among the valid fixtures must still fail the
  # whole action -- batching must not average it away.
  raw-batch-still-fails-on-one-bad-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plant a schema-invalid raw manifest beside the valid fixtures
        run: |
          mkdir -p bad-raw
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: bad\ndata:\n  - not-a-map\n' > bad-raw/cm.yaml
      - id: action
        uses: ./
        continue-on-error: true
      - name: The action must have failed on it
        run: test "${{ steps.action.outcome }}" = "failure"

  # #22: a CR whose CRD is NOT in the repo (here InfisicalSecret, in nearly
  # every consumer) is checked against schemas/cluster/, the cluster's own
  # CRDs, instead of being skipped. On the old action it was in the -skip
  # list, so a typo passed.
  cluster-schema-catches-a-typo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plant an InfisicalSecret with a misspelled field
        run: |
          # Only the planted file: the repo's fixtures must not decide this job.
          rm -rf tests/fixtures
          mkdir -p bad-cr
          cat > bad-cr/infisical.yaml <<'EOF'
          apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            name: x
          spec:
            managedSecretReference:
              secretName: x
              secretNamespace: x
            resyncIntervall: 60
          EOF
      - id: action
        uses: ./
        continue-on-error: true
      - name: The action must have failed on it
        run: test "${{ steps.action.outcome }}" = "failure"

  # #22: the CR shapes the old -skip list existed for must now PASS against
  # the cluster schemas, unskipped: kustomize's creationTimestamp: null under
  # SealedSecret spec.template.metadata (x-kubernetes-preserve-unknown-fields)
  # and InfisicalSecret managedSecretReference.template.metadata.
  formerly-skipped-shapes-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plant the shapes datree's schemas rejected
        run: |
          # Only the planted file: the repo's fixtures must not decide this job.
          rm -rf tests/fixtures
          mkdir -p ok-cr
          cat > ok-cr/kustomization.yaml <<'EOF'
          resources: [sealed.yaml, infisical.yaml]
          EOF
          cat > ok-cr/sealed.yaml <<'EOF'
          apiVersion: bitnami.com/v1alpha1
          kind: SealedSecret
          metadata:
            name: x
            namespace: x
          spec:
            encryptedData:
              k: AgB=
            template:
              metadata:
                name: x
                namespace: x
                annotations:
                  reloader.stakater.com/auto: "true"
          EOF
          cat > ok-cr/infisical.yaml <<'EOF'
          apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            name: x
            namespace: x
          spec:
            managedSecretReference:
              secretName: x
              secretNamespace: x
              template:
                metadata:
                  annotations:
                    reloader.stakater.com/auto: "true"
          EOF
      - uses: ./

  # #22 AC2: kubeconform keeps only the LAST -skip. Two -skips in
  # kubeconform_flags must BOTH apply (and so would the action's own list).
  every-skip-in-flags-applies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plant a schema-invalid ConfigMap
        run: |
          # Only the planted file: the repo's fixtures must not decide this job.
          rm -rf tests/fixtures
          mkdir -p skipped
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: bad\ndata:\n  - not-a-map\n' > skipped/cm.yaml
      - uses: ./
        with:
          kubeconform_flags: -skip ConfigMap -skip Secret

  vpa-coverage-unit:
    # D-012 PR-time check (homelab#529 AC2): added/changed workloads need a
    # VPA, untouched and image-only changes are not judged. Also every other
    # tests/test_*.py, incl. crd_schemas.py (#22).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install kubeconform (the version action.yml pins)
        # tests/test_crd_schemas.py round-trips converted schemas through the
        # real kubeconform and SKIPS without it; the `^OK$` check below then
        # fails on "OK (skipped=2)". Installed so they run, not skip.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp kubeconform
          mkdir -p "$HOME/.local/bin" && mv /tmp/kubeconform "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || { python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet pyyaml && export PATH=/tmp/v/bin:$PATH; }
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee ut.out
          grep -q '^OK$' ut.out
          grep -qE '^Ran [1-9][0-9]* tests' ut.out

  # dvystrcil/argocd#55: a kustomization under tests/ is a test harness that is
  # never deployed. It must still BUILD and pass kubeconform, but the deploy
  # policies (D-012 VPA, D-013 Reloader) do not apply to it: argocd's mTLS
  # harness (upstream base + one Component) went red on every ArgoCD bump for
  # lacking VPAs that prod has. The planted workload has BOTH gaps and is
  # absent from the PR base, so on a PR it counts as added (VPA check runs).
  test-harness-skips-deploy-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plant a harness workload with no VPA and no Reloader annotation
        run: &plant |
          # Only the planted file: the repo's fixtures must not decide this job.
          rm -rf tests/fixtures
          d=${PLANT_DIR:-tests/harness}
          mkdir -p "$d"
          cat > "$d/kustomization.yaml" <<'EOF'
          resources: [workload.yaml]
          EOF
          cat > "$d/workload.yaml" <<'EOF'
          apiVersion: secrets.infisical.com/v1alpha1
          kind: InfisicalSecret
          metadata:
            name: app
            namespace: harness
          spec:
            managedSecretReference:
              secretName: app-secrets
              secretNamespace: harness
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: app
            namespace: harness
          spec:
            selector:
              matchLabels: {app: app}
            template:
              metadata:
                labels: {app: app}
              spec:
                containers:
                - name: app
                  image: busybox:1.37
                  envFrom:
                  - secretRef:
                      name: app-secrets
          EOF
      - uses: ./

  # The exemption is for coverage policies only: a schema error in a harness
  # must still fail.
  test-harness-still-schema-checked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plant a schema-invalid ConfigMap in a harness
        run: |
          rm -rf tests/fixtures
          mkdir -p tests/harness
          printf 'resources: [cm.yaml]\n' > tests/harness/kustomization.yaml
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: bad\ndata:\n  - not-a-map\n' > tests/harness/cm.yaml
      - id: action
        uses: ./
        continue-on-error: true
      - name: The action must have failed on it
        run: test "${{ steps.action.outcome }}" = "failure"

  # Guard: the same workload OUTSIDE tests/ is a deployable root, and both
  # coverage gaps must still fail it. Without this job the exemption could
  # silently widen to everything.
  deploy-root-still-coverage-checked:
    runs-on: ubuntu-latest
    env:
      PLANT_DIR: deploy/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plant the same workload in a deployable root
        run: *plant
      - id: action
        uses: ./
        continue-on-error: true
      - name: The action must have failed on it (PR only; the VPA base needs one)
        if: github.event_name == 'pull_request'
        run: test "${{ steps.action.outcome }}" = "failure"
