# Trimmed from metallb v0.16.1 metallb-native.yaml: just enough schema for
# the fields the CR below uses.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: l2advertisements.metallb.io
spec:
  group: metallb.io
  names:
    kind: L2Advertisement
    listKind: L2AdvertisementList
    plural: l2advertisements
    singular: l2advertisement
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                ipAddressPools:
                  type: array
                  items:
                    type: string
                serviceSelectors:
                  type: array
                  items:
                    type: object
                    x-kubernetes-map-type: atomic
                    properties:
                      matchLabels:
                        type: object
                        additionalProperties:
                          type: string
