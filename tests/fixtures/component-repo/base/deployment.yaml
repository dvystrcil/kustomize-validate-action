apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fixture
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: busybox:1.36
